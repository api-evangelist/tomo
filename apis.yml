name: Tomo
description: 'Tomo is a consumer "personal AI" application that lives in your text
  messages: users tell Tomo about their life, goals, problems, and aspirations over
  SMS, and the AI assistant learns those goals and guides them toward achieving them
  through ongoing text-based conversation. Backed by Bain Capital Ventures and Ribbit
  Capital, Tomo operates in the AI-apps sector as a mobile-first consumer product rather
  than a developer platform. As of this enrichment pass the company publishes a marketing
  site (tomo.ai) with About, Careers, Privacy, Terms, and Login pages but no public
  developer program: no API documentation, OpenAPI/AsyncAPI specification, SDKs, CLI,
  MCP server, llms.txt, or .well-known discovery endpoints were found. This profile
  is maintained for API Evangelist network completeness.'
